[metadata]
name = "k8s-pods-ns"
description = """
Pods across the namespaces listed in ~/.config/television/k8s-targets
(one "<context> <namespace>" per line; '#' comments allowed).

Never uses --all-namespaces, so it works on locked-down clusters.
Cycle/edit that file to change which clusters + namespaces are shown.

  ctrl-l  follow logs      ctrl-e  exec /bin/sh
  ctrl-d  delete pod       ctrl-r  reload list
"""
requirements = ["kubectl"]

[source]
# For every configured "<context> <namespace>", list that namespace's pods.
# Emits TAB-separated:  context  namespace  name  status
command = '''
while read -r ctx ns _; do
  case "$ctx" in ''|\#*) continue ;; esac
  [ -z "$ns" ] && continue
  kubectl --context="$ctx" -n "$ns" get pods --no-headers 2>/dev/null \
    | awk -v c="$ctx" -v n="$ns" '{print c"\t"n"\t"$1"\t"$3}'
done < "${TV_K8S_TARGETS:-$HOME/.config/television/k8s-targets}"
'''
display = "{split:\t:2}   [{split:\t:0}/{split:\t:1}]  {split:\t:3}"
output = "{split:\t:2}"

[preview]
command = "kubectl --context={split:\t:0} -n {split:\t:1} describe pod {split:\t:2}"

[ui]
layout = "portrait"
preview_panel = { size = 65 }

[keybindings]
ctrl-l = "actions:logs"
ctrl-e = "actions:exec"
ctrl-d = "actions:delete"

[actions.logs]
description = "Follow logs"
command = "kubectl --context={split:\t:0} -n {split:\t:1} logs -f {split:\t:2}"
mode = "execute"

[actions.exec]
description = "Exec /bin/sh in pod"
command = "kubectl --context={split:\t:0} -n {split:\t:1} exec -it {split:\t:2} -- /bin/sh"
mode = "execute"

[actions.delete]
description = "Delete pod"
command = "kubectl --context={split:\t:0} -n {split:\t:1} delete pod {split:\t:2}"
mode = "execute"
