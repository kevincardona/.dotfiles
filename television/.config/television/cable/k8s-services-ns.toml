[metadata]
name = "k8s-services-ns"
description = """
Services across the namespaces in ~/.config/television/k8s-targets
(one "<context> <namespace>" per line). Never uses --all-namespaces.

Read-only.
  ctrl-e  show endpoints    ctrl-y  view yaml
"""
requirements = ["kubectl"]

[source]
# Flags AFTER the verb so wrapped/plugin kubectls accept them.
# Emits TAB-separated:  context  namespace  name  type  ports
command = '''
while read -r ctx ns _; do
  case "$ctx" in ''|\#*) continue ;; esac
  [ -z "$ns" ] && continue
  kubectl get svc --no-headers -n "$ns" --context "$ctx" 2>/dev/null \
    | awk -v c="$ctx" -v n="$ns" '{print c"\t"n"\t"$1"\t"$2"\t"$5}'
done < "${TV_K8S_TARGETS:-$HOME/.config/television/k8s-targets}"
'''
display = "{split:\t:2}   [{split:\t:0}/{split:\t:1}]  {split:\t:3}  {split:\t:4}"
output = "{split:\t:2}"

[preview]
command = "kubectl describe svc {split:\t:2} -n {split:\t:1} --context {split:\t:0}"

[ui]
layout = "portrait"
preview_panel = { size = 65 }

[keybindings]
ctrl-e = "actions:endpoints"
ctrl-y = "actions:yaml"

[actions.endpoints]
description = "Show endpoints (backing pods)"
command = "kubectl get endpoints {split:\t:2} -n {split:\t:1} --context {split:\t:0} -o wide | less -R"
mode = "execute"

[actions.yaml]
description = "View service YAML"
command = "kubectl get svc {split:\t:2} -n {split:\t:1} --context {split:\t:0} -o yaml | less -R"
mode = "execute"
