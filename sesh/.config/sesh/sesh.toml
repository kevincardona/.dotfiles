# sesh — smart tmux session manager (https://github.com/joshmedeski/sesh)
#
# `sesh list` merges: configured sessions (below) + live tmux sessions + zoxide
# frecency dirs. Television is the picker (channel: sesh); tmux `prefix + f`
# runs `sesh connect` on the choice.

[default_session]
preview_command = "ls -la {}"

# Always-available named sessions. Everything else comes from zoxide/tmux.
[[session]]
name = "dotfiles"
path = "~/.dotfiles"

[[session]]
name = "config"
path = "~/.config"
