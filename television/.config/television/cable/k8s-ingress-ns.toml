[metadata]
name = "k8s-ingress-ns"
description = """
Ingresses, scoped per cluster/namespace (ctrl-s to switch scope). Read-only.
Preview = kubectl describe (rules, hosts, TLS, backend services).

  ctrl-y  view yaml    ctrl-e  services in this namespace    ctrl-s  switch scope
"""
requirements = ["kubectl"]

[source]
# TAB:  context  namespace  name  class  hosts  address
output = "{split:\t:2}"
display = "{split:\t:2}   [{split:\t:0}/{split:\t:1}]  {split:\t:4}  ->  {split:\t:5}"

[[source.command]]
name = "sf-test"
run = '''kubectl get ingress --no-headers -n number-provisioning-beta --context sf-test 2>/dev/null | awk '{print "sf-test\tnumber-provisioning-beta\t"$1"\t"$2"\t"$3"\t"$4}' '''

[[source.command]]
name = "au-test"
run = '''kubectl get ingress --no-headers -n number-provisioning-beta --context au-test 2>/dev/null | awk '{print "au-test\tnumber-provisioning-beta\t"$1"\t"$2"\t"$3"\t"$4}' '''

[[source.command]]
name = "test (sf+au)"
run = '''for c in sf-test au-test; do kubectl get ingress --no-headers -n number-provisioning-beta --context "$c" 2>/dev/null | awk -v c="$c" '{print c"\tnumber-provisioning-beta\t"$1"\t"$2"\t"$3"\t"$4}'; done'''

[[source.command]]
name = "all configured (slow)"
run = '''while read -r ctx ns _; do case "$ctx" in ''|\#*) continue ;; esac; [ -z "$ns" ] && continue; kubectl get ingress --no-headers -n "$ns" --context "$ctx" 2>/dev/null | awk -v c="$ctx" -v n="$ns" '{print c"\t"n"\t"$1"\t"$2"\t"$3"\t"$4}'; done < "${TV_K8S_TARGETS:-$HOME/.config/television/k8s-targets}"'''

[preview]
command = "kubectl describe ingress {split:\t:2} -n {split:\t:1} --context {split:\t:0}"

[ui]
layout = "portrait"
preview_panel = { size = 65 }

[keybindings]
ctrl-y = "actions:yaml"
ctrl-e = "actions:services"

[actions.yaml]
description = "View ingress YAML"
command = "kubectl get ingress {split:\t:2} -n {split:\t:1} --context {split:\t:0} -o yaml | less -R"
mode = "execute"

[actions.services]
description = "Services in this namespace (ingress backends live here)"
command = "kubectl get svc -n {split:\t:1} --context {split:\t:0} -o wide | less -R"
mode = "execute"
