# Tmux Light Theme Configuration
# Based on tmux-nova with light colors

set -g @nova-segment-mode-colors "#{?client_prefix,#d97706,#{?pane_in_mode,#dc2626,#059669}} #f8f9fa"
set -g @nova-segment-whoami-colors "#{?client_prefix,#d97706,#{?pane_in_mode,#dc2626,#059669}} #f8f9fa"

# Status bar colors
set -g status-style "bg=#f8f9fa,fg=#1f2937"
set -g message-style "bg=#e5e7eb,fg=#1f2937"
set -g message-command-style "bg=#e5e7eb,fg=#1f2937"

# Pane border colors
set -g pane-border-style "fg=#d1d5db"
set -g pane-active-border-style "fg=#9ca3af"

# Window status colors
set -g window-status-style "bg=#f8f9fa,fg=#6b7280"
set -g window-status-current-style "bg=#e5e7eb,fg=#1f2937"
