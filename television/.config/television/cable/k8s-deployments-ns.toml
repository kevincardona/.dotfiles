[metadata]
name = "k8s-deployments-ns"
description = """
Deployments, scoped per cluster/namespace so it loads FAST (ctrl-s to switch
scope: sf-test -> au-test -> both -> all). Read-focused.

  ctrl-l  follow logs (JSON-highlighted)   ctrl-y  view yaml
  ctrl-s  switch scope
  ctrl-x  more: rollout status/history, events, services/ingress, restart (only write)
"""
requirements = ["kubectl"]

[source]
# TAB:  context  namespace  name  ready  age
output = "{split:\t:2}"
display = "{split:\t:2}   [{split:\t:0}/{split:\t:1}]  ready {split:\t:3}  {split:\t:4}"

[[source.command]]
name = "sf-test"
run = '''kubectl get deployments --no-headers -n number-provisioning-beta --context sf-test 2>/dev/null | awk '{print "sf-test\tnumber-provisioning-beta\t"$1"\t"$2"\t"$5}' '''

[[source.command]]
name = "au-test"
run = '''kubectl get deployments --no-headers -n number-provisioning-beta --context au-test 2>/dev/null | awk '{print "au-test\tnumber-provisioning-beta\t"$1"\t"$2"\t"$5}' '''

[[source.command]]
name = "test (sf+au)"
run = '''for c in sf-test au-test; do kubectl get deployments --no-headers -n number-provisioning-beta --context "$c" 2>/dev/null | awk -v c="$c" '{print c"\tnumber-provisioning-beta\t"$1"\t"$2"\t"$5}'; done'''

[[source.command]]
name = "all configured (slow)"
run = '''while read -r ctx ns _; do case "$ctx" in ''|\#*) continue ;; esac; [ -z "$ns" ] && continue; kubectl get deployments --no-headers -n "$ns" --context "$ctx" 2>/dev/null | awk -v c="$ctx" -v n="$ns" '{print c"\t"n"\t"$1"\t"$2"\t"$5}'; done < "${TV_K8S_TARGETS:-$HOME/.config/television/k8s-targets}"'''

[preview]
command = "kubectl describe deployment {split:\t:2} -n {split:\t:1} --context {split:\t:0}"

[ui]
layout = "portrait"
preview_panel = { size = 65 }

[keybindings]
ctrl-l = "actions:logs"
ctrl-y = "actions:yaml"

[actions.logs]
description = "Follow logs, all pods (JSON-highlighted)"
command = "kubectl logs -f deployment/{split:\t:2} -n {split:\t:1} --context {split:\t:0} --all-containers --prefix --max-log-requests=30 | jq -R -r -C -c 'fromjson? // .'"
mode = "execute"

[actions.status]
description = "Rollout status"
command = "kubectl rollout status deployment/{split:\t:2} -n {split:\t:1} --context {split:\t:0}"
mode = "execute"

[actions.history]
description = "Rollout history"
command = "kubectl rollout history deployment/{split:\t:2} -n {split:\t:1} --context {split:\t:0} | less -R"
mode = "execute"

[actions.yaml]
description = "View deployment YAML"
command = "kubectl get deployment {split:\t:2} -n {split:\t:1} --context {split:\t:0} -o yaml | less -R"
mode = "execute"

[actions.events]
description = "Recent events in this namespace"
command = "kubectl get events -n {split:\t:1} --context {split:\t:0} --sort-by=.lastTimestamp | less -R"
mode = "execute"

[actions.services]
description = "Services in this namespace"
command = "kubectl get svc -n {split:\t:1} --context {split:\t:0} -o wide | less -R"
mode = "execute"

[actions.restart]
description = "Rollout restart (WRITE — rolling, non-destructive)"
command = "kubectl rollout restart deployment/{split:\t:2} -n {split:\t:1} --context {split:\t:0}"
mode = "execute"
