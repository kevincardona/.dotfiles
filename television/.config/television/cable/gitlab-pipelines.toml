[metadata]
name = "gitlab-pipelines"
description = """
CI pipelines for the current repo, via your glab-pipelines script (GitLab REST
API + token from GITLAB_TOKEN or macOS Keychain). Run it from inside a repo
that has a GitLab remote.

  enter   open pipeline in browser     ctrl-w  watch until done (notifies)
  ctrl-r  reload
"""
requirements = ["glab-pipelines"]

[source]
# glab-pipelines --list emits TAB-separated:  id  status  ref  date  web_url
command = "glab-pipelines --list"
display = "{split:\t:1}  #{split:\t:0}  {split:\t:2}  {split:\t:3}"
output = "{split:\t:4}"

[preview]
command = "git log --oneline -15 --color=always {split:\t:2} 2>/dev/null || echo 'ref: {split:\t:2}'"

[ui]
layout = "portrait"
preview_panel = { size = 45 }

[keybindings]
enter = "actions:open"
ctrl-w = "actions:watch"

[actions.open]
description = "Open pipeline in browser"
command = "open {split:\t:4}"
mode = "execute"

[actions.watch]
description = "Watch pipeline until it finishes (desktop notification)"
command = "glab-pipelines --watch {split:\t:0}"
mode = "execute"
