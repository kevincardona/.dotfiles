set -g prefix C-b
set -g mouse on

# Styling for active/inactive panes
set -g default-terminal "xterm-256color"
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors - needs tmux-3.0
set -g allow-rename off

# Buffer settings
set-option -g history-limit 90000
bind-key / copy-mode \; send-keys ?

setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Copy Mode Settings
setw -g mode-keys vi
set -g set-clipboard on
bind-key -T copy-mode-vi 'v' send -X begin-selection
# Yank selection to the macOS clipboard (keyboard 'y' or releasing a mouse drag)
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi 'Enter' send -X copy-pipe-and-cancel 'pbcopy'

bind-key -n M-S-l if-shell "[ '#{pane_current_command}' = 'nvim' ]" \
    "send-keys Escape ':BufferLineCycleNext' Enter" \
    "next-window"

bind-key -n M-S-h if-shell "[ '#{pane_current_command}' = 'nvim' ]" \
    "send-keys Escape ':BufferLineCyclePrev' Enter" \
    "previous-window"

bind-key -n M-w if-shell "[ '#{pane_current_command}' = 'nvim' ]" \
    "send-keys Escape ':bd' Enter" \
    ""

bind-key -n M-s if-shell "[ '#{pane_current_command}' = 'nvim' ]" \
    "send-keys Escape ':w' Enter" \
    ""

bind-key -n M-a if-shell "[ '#{pane_current_command}' = 'nvim' ]" \
    "send-keys Escape 'ggVG'" \
    ""

bind-key -n M-/ if-shell "[ '#{pane_current_command}' = 'nvim' ]" \
    "send-keys 'gcc'" \
    ""

bind-key -n M-c if-shell "[ '#{pane_current_command}' = 'nvim' ]" \
    "send-keys 'y'" \
    ""

bind-key -n M-j resize-pane -Z

bind-key -n M-p if-shell "[ '#{pane_current_command}' = 'nvim' ]" \
    "send-keys Escape Space 'pf'" \
    ""

bind-key -n M-S-f if-shell "[ '#{pane_current_command}' = 'nvim' ]" \
    "send-keys Escape Space 'ps'" \
    ""

# Project Navigation
# prefix + f  → project switcher (tmux-sessionizer, now using television as the picker)
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Television channel popups
# prefix + K  → kubernetes pods (namespace-scoped; edit ~/.config/television/k8s-targets)
bind-key K display-popup -w 90% -h 85% -E 'tv k8s-pods-ns'
# prefix + D  → kubernetes deployments (namespace-scoped)
bind-key D display-popup -w 90% -h 85% -E 'tv k8s-deployments-ns'
# prefix + I  → kubernetes ingresses (namespace-scoped)
bind-key I display-popup -w 90% -h 85% -E 'tv k8s-ingress-ns'
# prefix + A  → argocd apps (run `argocd login <server>` first)
bind-key A display-popup -w 90% -h 85% -E 'tv argocd-apps'
# prefix + T  → television launcher (press Ctrl-T inside to switch channels)
bind-key T display-popup -w 90% -h 85% -E 'tv'
# prefix + P  → gitlab pipelines for the repo in the current pane
bind-key P display-popup -d "#{pane_current_path}" -w 80% -h 70% -E 'tv gitlab-pipelines'
# keep prefix + L as tmux's default "switch to last session" (was clobbered)
bind-key L switch-client -l

# Session Navigation
bind-key ) switch-client -n
bind-key ( switch-client -p
bind-key -r j join-pane -t :.+
set-option -g detach-on-destroy off

# Window Navigation
bind -n M-l next-window
bind -n M-h previous-window

# Tmux Splits
bind -n C-v split-window -hc "#{pane_current_path}"
bind -n C-n if-shell -F '#{window_zoomed_flag}' 'select-pane -D' 'split-window -vc "#{pane_current_path}"'

# Navigate panes with Ctrl + h, j, k, l
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# search for a window in all sessions
bind p display-popup -w 80% -h 80% -E "tmux list-windows -a -F '#{session_name}:#{window_index} - #{window_name}' \
    | grep -v \"^$(tmux display-message -p '#S')\$\" \
    | fzf --reverse --preview 'tmux capture-pane -t {1} -pS -100' --preview-window=right:60% \
    | sed -E 's/\s-.*$//' \
    | xargs -r tmux switch-client -t"

# interactive shell
bind g display-popup -d 60 "zsh"

# search for a window in current session
bind w display-popup -w 80% -h 80% -E "tmux list-windows -F '#{session_name}:#{window_index} - #{window_name}' \
    | grep -v \"^$(tmux display-message -p '#S')\$\" \
    | fzf --reverse --preview 'tmux capture-pane -t {1} -pS -100' --preview-window=right:60% \
    | sed -E 's/\s-.*$//' \
    | xargs -r tmux switch-client -t"


# bind o run-shell "tmux has-session -t ollama 2>/dev/null && tmux switch-client -t ollama || tmux new-session -d -s ollama 'ollama serve &>/dev/null & sleep 2 && ollama run minimax-m2:cloud' && tmux switch-client -t ollama"
bind o run-shell "tmux has-session -t ollama 2>/dev/null && tmux switch-client -t ollama || tmux new-session -d -s ollama 'ollama serve &>/dev/null & sleep 2 && ollama run minimax-m2:cloud' && tmux switch-client -t ollama"


# Navigate Copy Mode
bind -n M-S-k copy-mode \; send-keys -X scroll-up
bind -n M-S-j copy-mode \; send-keys -X scroll-down

# Resize panes using Alt (Meta) + arrow keys
bind -n C-M-k resize-pane -U 5
bind -n C-M-j resize-pane -D 5
bind -n C-M-h resize-pane -L 5
bind -n C-M-l resize-pane -R 5

# Resize pane using Shift + Arrow keys
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up resize-pane -U 2
bind -n S-Down resize-pane -D 2

# Bind reload key
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g status-left-length 50
set -g @plugin 'o0th/tmux-nova'
set -g @nova-segment-mode "#{?client_prefix,,#{?pane_in_mode,,}}#(tmux display-message -p '#S')"
set -g @nova-segment-whoami "#(git branch --show-current 2>/dev/null)"
set -g @nova-pane "#I: #W"
set -g @nova-rows 0
set -g @nova-segments-0-left "mode"
set -g @nova-segments-0-right "whoami"

# Source theme based on ~/.theme_mode file
if-shell "test -f ~/.theme_mode && grep -q 'light' ~/.theme_mode" \
    "source-file ~/.dotfiles/tmux/themes/light.conf" \
    "source-file ~/.dotfiles/tmux/themes/dark.conf"

set -g @tpm-clean 'R'

# Auto install tpm and plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

