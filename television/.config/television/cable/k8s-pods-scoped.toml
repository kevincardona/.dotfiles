[metadata]
name = "k8s-pods-scoped"
description = """
Pods in $K8S_CTX / $K8S_NS. READ-ONLY unless the namespace's perm is 'rw'.

  enter / ctrl-l  logs in a dedicated window   ctrl-y  yaml    ctrl-e  exec (WRITE)
  ctrl-d  -> this pod's deployment   ctrl-g  -> ingresses   ctrl-v  -> services
  ctrl-x  more: events, top
"""
requirements = ["kubectl"]

[source]
# rows (space-delimited):  name status restarts age   (context/namespace from env)
output = "{0}"
display = "{0}   {1}  restarts:{2}  {3}"
command = '''kubectl get pods --no-headers -n "$K8S_NS" --context "$K8S_CTX" 2>/dev/null | awk '{print $1" "$3" "$4" "$NF}' '''

[preview]
command = "kubectl describe pod {0} -n $K8S_NS --context $K8S_CTX"

[ui]
layout = "portrait"
preview_panel = { size = 65 }

[keybindings]
enter = "actions:logs"
ctrl-l = "actions:logs"
ctrl-y = "actions:yaml"
ctrl-e = "actions:exec"
ctrl-d = "actions:to_deploy"
ctrl-g = "actions:to_ingress"
ctrl-v = "actions:to_svc"

[actions.logs]
description = "Logs in the dedicated 'k8s' tmux session (JSON + [ctx/ns/pod]) — read"
command = "p={0}; if kubectl get pod \"$p\" -n $K8S_NS --context $K8S_CTX >/dev/null 2>&1; then $HOME/.local/bin/klog $K8S_CTX $K8S_NS \"$p\"; else printf '\\nNo pod \"%s\" in %s/%s — is the cluster up and pods listed?\\n\\nPress enter...' \"$p\" \"$K8S_CTX\" \"$K8S_NS\"; read _ </dev/tty 2>/dev/null || true; fi"
mode = "execute"

[actions.yaml]
description = "View pod YAML — read"
command = "kubectl get pod {0} -n $K8S_NS --context $K8S_CTX -o yaml | less -R"
mode = "execute"

[actions.events]
description = "Recent events for this pod — read"
command = "kubectl get events -n $K8S_NS --context $K8S_CTX --field-selector involvedObject.name={0} --sort-by=.lastTimestamp | less -R"
mode = "execute"

[actions.top]
description = "Resource usage (needs metrics-server) — read"
command = "kubectl top pod {0} -n $K8S_NS --context $K8S_CTX --containers | less -R"
mode = "execute"

[actions.to_deploy]
description = "-> this pod's deployment (derived from the pod name)"
command = "d=$(printf '%s' '{0}' | sed -E 's/-[a-z0-9]+-[a-z0-9]+$//'); tv k8s-deploy-scoped --input \"$d\" --input-header \"$K8S_CTX / $K8S_NS · pod {0}\""
mode = "execute"

[actions.to_ingress]
description = "-> ingresses in this namespace"
command = "tv k8s-ingress-scoped --input-header \"$K8S_CTX / $K8S_NS\""
mode = "execute"

[actions.to_svc]
description = "-> services in this namespace"
command = "tv k8s-svc-scoped --input-header \"$K8S_CTX / $K8S_NS\""
mode = "execute"

[actions.exec]
description = "Exec /bin/sh — WRITE, only if namespace perm is rw"
command = "if [ \"$K8S_PERM\" = rw ]; then kubectl exec -it {0} -n $K8S_NS --context $K8S_CTX -- /bin/sh; else echo; echo \"REFUSED: $K8S_CTX/$K8S_NS is read-only (perm not rw in k8s-targets).\"; echo; printf 'Press enter... '; read _; fi"
mode = "execute"
