[metadata]
name = "gitlab-pipelines"
description = """
CI pipelines via your glab-pipelines script (GitLab REST API + token from
GITLAB_TOKEN or macOS Keychain).

  ctrl-s  switch source: Pipelines (this repo) ↔ Pinned (watchlist, any repo)

  enter   open in browser     ctrl-w  watch in background (notifies when done)
  ctrl-p  pin to watchlist    ctrl-d  unpin      ctrl-o  jump to project session
  ctrl-g  jump to Jira ticket (or MR / commit)   ctrl-r  reload
"""

[source]
# Two sources, cycled with ctrl-s. Both emit TAB-separated:
#   id  status  ref  context  web_url   (context = date for repo, project for pinned)
# Absolute path: tv's shell may not have ~/.local/bin on PATH (tmux server PATH).
command = [
  { name = "Pipelines", run = "$HOME/.local/bin/glab-pipelines --list" },
  { name = "Pinned",    run = "$HOME/.local/bin/glab-pipelines --pinned" },
]
display = "{split:\t:1}  #{split:\t:0}  {split:\t:2}  {split:\t:3}"
output = "{split:\t:4}"

[preview]
command = "git log --oneline -15 --color=always {split:\t:2} 2>/dev/null || echo 'ref: {split:\t:2}'"

[ui]
layout = "portrait"
preview_panel = { size = 45 }

[keybindings]
enter = "actions:open"
ctrl-w = "actions:watch"
ctrl-p = "actions:pin"
ctrl-d = ["actions:unpin", "reload_source"]
ctrl-o = "actions:goto"
ctrl-g = "actions:related"

[actions.open]
description = "Open pipeline in browser"
command = "open {split:\t:4}"
mode = "execute"

[actions.watch]
description = "Watch in the background; desktop notification when it finishes"
command = "$HOME/.local/bin/glab-pipelines --watch-bg '{split:\t:4}'"
mode = "execute"

[actions.pin]
description = "Pin to the watchlist (ctrl-s → Pinned)"
command = "$HOME/.local/bin/glab-pipelines --pin '{split:\t:4}'"
mode = "fork"

[actions.unpin]
description = "Remove from the watchlist"
command = "$HOME/.local/bin/glab-pipelines --unpin '{split:\t:4}'"
mode = "fork"

[actions.goto]
description = "Jump to the project's local tmux session"
command = "$HOME/.local/bin/glab-pipelines --goto '{split:\t:4}'"
mode = "execute"

[actions.related]
description = "Jump to the Jira ticket (from the branch), else the MR, else the commit"
command = "$HOME/.local/bin/glab-pipelines --related '{split:\t:4}' '{split:\t:2}'"
mode = "execute"
