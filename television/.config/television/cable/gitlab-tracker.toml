# Television channel: pinned GitLab pipelines with live status, across repos.
# A watchlist — pin builds from the `gitlab-pipelines` channel (ctrl-p), then
# track their status here. Backed by `glab-pipelines --pinned`.
#
#   enter   open pipeline in browser     ctrl-d  unpin      ctrl-r  refresh status

[metadata]
name = "gitlab-tracker"
description = """
Pinned GitLab pipelines with live status (cross-repo watchlist). Pin from the
gitlab-pipelines channel with ctrl-p.

  enter   open in browser     ctrl-d  unpin     ctrl-r  refresh
"""

[source]
# glab-pipelines --pinned emits TSV:  id  status  project  ref  web_url
command = "$HOME/.local/bin/glab-pipelines --pinned"
output = "{split:\t:4}"

[preview]
command = "printf 'project: %s\\nref:     %s\\nstatus:  %s\\n\\n%s\\n' '{split:\t:2}' '{split:\t:3}' '{split:\t:1}' '{split:\t:4}'"

[ui]
layout = "portrait"
preview_panel = { size = 40 }

[keybindings]
enter = "actions:open"
ctrl-d = ["actions:unpin", "reload_source"]
ctrl-r = "reload_source"

[actions.open]
description = "Open pipeline in browser"
command = "open '{split:\t:4}'"
mode = "execute"

[actions.unpin]
description = "Remove this pipeline from the tracker"
command = "$HOME/.local/bin/glab-pipelines --unpin '{split:\t:4}'"
mode = "fork"
