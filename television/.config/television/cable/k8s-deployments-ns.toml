[metadata]
name = "k8s-deployments-ns"
description = """
Deployments across the namespaces in ~/.config/television/k8s-targets
(one "<context> <namespace>" per line). Never uses --all-namespaces.

Read-focused. Press ctrl-x for the full list.
  ctrl-l  follow logs      ctrl-y  view yaml
  ctrl-x  more: rollout status / history, restart (the only write action)
"""
requirements = ["kubectl"]

[source]
# Flags AFTER the verb so wrapped/plugin kubectls accept them.
# Emits TAB-separated:  context  namespace  name  ready  age
command = '''
while read -r ctx ns _; do
  case "$ctx" in ''|\#*) continue ;; esac
  [ -z "$ns" ] && continue
  kubectl get deployments --no-headers -n "$ns" --context "$ctx" 2>/dev/null \
    | awk -v c="$ctx" -v n="$ns" '{print c"\t"n"\t"$1"\t"$2"\t"$5}'
done < "${TV_K8S_TARGETS:-$HOME/.config/television/k8s-targets}"
'''
display = "{split:\t:2}   [{split:\t:0}/{split:\t:1}]  ready {split:\t:3}  {split:\t:4}"
output = "{split:\t:2}"

[preview]
command = "kubectl describe deployment {split:\t:2} -n {split:\t:1} --context {split:\t:0}"

[ui]
layout = "portrait"
preview_panel = { size = 65 }

[keybindings]
ctrl-l = "actions:logs"
ctrl-y = "actions:yaml"

[actions.logs]
description = "Follow logs (all containers)"
command = "kubectl logs -f deployment/{split:\t:2} -n {split:\t:1} --context {split:\t:0} --all-containers --prefix --tail=200"
mode = "execute"

[actions.status]
description = "Rollout status"
command = "kubectl rollout status deployment/{split:\t:2} -n {split:\t:1} --context {split:\t:0}"
mode = "execute"

[actions.history]
description = "Rollout history"
command = "kubectl rollout history deployment/{split:\t:2} -n {split:\t:1} --context {split:\t:0} | less -R"
mode = "execute"

[actions.yaml]
description = "View deployment YAML"
command = "kubectl get deployment {split:\t:2} -n {split:\t:1} --context {split:\t:0} -o yaml | less -R"
mode = "execute"

[actions.restart]
description = "Rollout restart (WRITE — rolling, non-destructive)"
command = "kubectl rollout restart deployment/{split:\t:2} -n {split:\t:1} --context {split:\t:0}"
mode = "execute"
