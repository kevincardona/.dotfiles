[metadata]
name = "k8s-services-ns"
description = """
Services across the namespaces listed in ~/.config/television/k8s-targets
(one "<context> <namespace>" per line; '#' comments allowed).

Never uses --all-namespaces.

  ctrl-e  show endpoints    ctrl-r  reload list
"""
requirements = ["kubectl"]

[source]
# Emits TAB-separated:  context  namespace  name  type  ports
command = '''
while read -r ctx ns _; do
  case "$ctx" in ''|\#*) continue ;; esac
  [ -z "$ns" ] && continue
  kubectl --context="$ctx" -n "$ns" get svc --no-headers 2>/dev/null \
    | awk -v c="$ctx" -v n="$ns" '{print c"\t"n"\t"$1"\t"$2"\t"$5}'
done < "${TV_K8S_TARGETS:-$HOME/.config/television/k8s-targets}"
'''
display = "{split:\t:2}   [{split:\t:0}/{split:\t:1}]  {split:\t:3}  {split:\t:4}"
output = "{split:\t:2}"

[preview]
command = "kubectl --context={split:\t:0} -n {split:\t:1} describe svc {split:\t:2}"

[ui]
layout = "portrait"
preview_panel = { size = 65 }

[keybindings]
ctrl-e = "actions:endpoints"

[actions.endpoints]
description = "Show endpoints"
command = "kubectl --context={split:\t:0} -n {split:\t:1} get endpoints {split:\t:2} -o wide"
mode = "execute"
