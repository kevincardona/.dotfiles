# Tmux Dark Theme Configuration
# Based on tmux-nova with dark colors

set -g @nova-segment-mode-colors "#{?client_prefix,#e6cc00,#{?pane_in_mode,#db3716,#05ae30}} #282a36"
set -g @nova-segment-whoami-colors "#{?client_prefix,#e6cc00,#{?pane_in_mode,#db3716,#05ae30}} #282a36"

# Status bar colors
set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g message-command-style "bg=#44475a,fg=#f8f8f2"

# Pane border colors
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#6272a4"

# Window status colors
set -g window-status-style "bg=#282a36,fg=#6272a4"
set -g window-status-current-style "bg=#44475a,fg=#f8f8f2"
